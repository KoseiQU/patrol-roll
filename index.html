<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#18b9c4">
  <meta name="description" content="市民参加型インフラ点検PWA デモ版">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="パとるロール">

  <title>パとるロール</title>

  <!-- PWA manifest + apple touch icon -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Google Fonts: M PLUS Rounded 1c -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">

  <!-- Design tokens + base reset -->
  <link rel="stylesheet" href="css/theme.css?v=6">
  <!-- App styles (P2) -->
  <link rel="stylesheet" href="css/app.css?v=6" id="app-css">
</head>
<body>

  <!-- ── Geo-denied banner (shown by app.js when geolocation blocked) ── -->
  <div id="geo-banner" hidden>
    現在地が取れないため東京駅周辺を表示中
  </div>

  <!-- ── Header bar (P2 fills content) ─────────────────────────────── -->
  <header id="header-bar">
    <!-- left: avatar chip (P2) -->
    <div id="avatar-chip"></div>
    <!-- center: logo (P2) -->
    <div id="logo-area">
      <span class="logo-text">パ<span class="logo-accent">とる</span>📸ロール</span>
    </div>
    <!-- right: notification bell (P3) -->
    <div id="notif-bell"></div>
  </header>

  <!-- ── Full-screen map ─────────────────────────────────────────────── -->
  <div id="map"></div>

  <!-- ── FAB area (P2 fills) ────────────────────────────────────────── -->
  <div id="fab-area">
    <!-- main camera FAB (P2) -->
    <div id="fab-main"></div>
  </div>

  <!-- ── Right-side quick actions (P2) ─────────────────────────────── -->
  <div id="quick-actions">
    <div id="btn-locate"></div>
    <div id="btn-my-reports"></div>
    <div id="btn-settings"></div>
  </div>

  <!-- ── Legend chip (P2) ──────────────────────────────────────────── -->
  <div id="legend-chip"></div>

  <!-- ── Sheet / overlay mount points (P2) ────────────────────────── -->
  <div id="sheet-root"></div>
  <div id="overlay-root"></div>

  <!-- ═══════════════════════════════════════════════════════════════
       Script load order (DESIGN.md §3) — ALL tags present from P1.
       Unimplemented modules are placeholder stubs (no 404s).
       ════════════════════════════════════════════════════════════ -->

  <!-- CDN libs -->
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Note: タイル本番利用時はCARTOの商用契約を確認すること -->
  <script src="https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- Engine layer (P1) -->
  <script src="js/store.js?v=6"></script>
  <script src="js/ai.js?v=6"></script>
  <script src="js/seed.js?v=6"></script>

  <!-- UI layer (P2) -->
  <script src="js/ui.js?v=6"></script>
  <script src="js/map.js?v=6"></script>
  <script src="js/post.js?v=6"></script>
  <script src="js/detail.js?v=6"></script>
  <script src="js/profile.js?v=6"></script>
  <script src="js/onboarding.js?v=6"></script>

  <!-- Operator layer (P3) -->
  <script src="js/notify.js?v=6"></script>
  <script src="js/dashboard.js?v=6"></script>
  <script src="js/settings.js?v=6"></script>

  <!-- Test + boot (P1) -->
  <script src="js/selftest.js?v=6"></script>
  <script src="js/app.js?v=6"></script>

</body>
</html>
