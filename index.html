<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#18b9c4">
  <meta name="description" content="市民参加型インフラ点検PWA デモ版">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="パとるロール">

  <title>パとるロール</title>

  <!-- PWA manifest + apple touch icon -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Google Fonts: M PLUS Rounded 1c -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">

  <!-- Design tokens + base reset -->
  <link rel="stylesheet" href="css/theme.css">
  <!-- App styles (P2) -->
  <link rel="stylesheet" href="css/app.css" id="app-css">
</head>
<body>

  <!-- ── Geo-denied banner (shown by app.js when geolocation blocked) ── -->
  <div id="geo-banner" hidden
    style="position:fixed;top:0;left:0;right:0;z-index:9999;
           background:#ffa726;color:#fff;text-align:center;
           font-size:13px;padding:6px env(safe-area-inset-right,0) 6px env(safe-area-inset-left,0);
           font-family:var(--font)">
    現在地が取れないため東京駅周辺を表示中
  </div>

  <!-- ── Header bar (P2 fills content) ─────────────────────────────── -->
  <header id="header-bar"
    style="position:fixed;top:0;left:0;right:0;z-index:1000;
           display:flex;align-items:center;justify-content:space-between;
           padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;
           pointer-events:none">
    <!-- left: avatar chip (P2) -->
    <div id="avatar-chip" style="pointer-events:auto"></div>
    <!-- center: logo (P2) -->
    <div id="logo-area" style="pointer-events:auto">
      <span style="font-family:var(--font);font-weight:800;font-size:18px;color:var(--ink);
                   text-shadow:0 1px 4px rgba(255,255,255,.8)">パ<span style="color:var(--c-accent)">とる</span>📸ロール</span>
    </div>
    <!-- right: notification bell (P3) -->
    <div id="notif-bell" style="pointer-events:auto"></div>
  </header>

  <!-- ── Full-screen map ─────────────────────────────────────────────── -->
  <div id="map"></div>

  <!-- ── FAB area (P2 fills) ────────────────────────────────────────── -->
  <div id="fab-area"
    style="position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
           left:0;right:0;z-index:1000;display:flex;flex-direction:column;align-items:center;
           pointer-events:none">
    <!-- main camera FAB (P2) -->
    <div id="fab-main" style="pointer-events:auto"></div>
  </div>

  <!-- ── Right-side quick actions (P2) ─────────────────────────────── -->
  <div id="quick-actions"
    style="position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 120px);
           z-index:1000;display:flex;flex-direction:column;gap:10px;pointer-events:auto">
    <div id="btn-locate"></div>
    <div id="btn-my-reports"></div>
    <div id="btn-settings"></div>
  </div>

  <!-- ── Legend chip (P2) ──────────────────────────────────────────── -->
  <div id="legend-chip"
    style="position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);
           z-index:1000;pointer-events:auto">
  </div>

  <!-- ── Sheet / overlay mount points (P2) ────────────────────────── -->
  <div id="sheet-root"></div>
  <div id="overlay-root"></div>

  <!-- ═══════════════════════════════════════════════════════════════
       Script load order (DESIGN.md §3) — ALL tags present from P1.
       Unimplemented modules are placeholder stubs (no 404s).
       ════════════════════════════════════════════════════════════ -->

  <!-- CDN libs -->
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Note: タイル本番利用時はCARTOの商用契約を確認すること -->
  <script src="https://cdn.jsdelivr.net/npm/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- Engine layer (P1) -->
  <script src="js/store.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/seed.js"></script>

  <!-- UI layer (P2) -->
  <script src="js/ui.js"></script>
  <script src="js/map.js"></script>
  <script src="js/post.js"></script>
  <script src="js/detail.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/onboarding.js"></script>

  <!-- Operator layer (P3) -->
  <script src="js/notify.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/settings.js"></script>

  <!-- Test + boot (P1) -->
  <script src="js/selftest.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
